apiVersion: apps/v1
kind: Deployment
metadata:
  name: gearup-api
  namespace: gearup
  labels:
    app: gearup-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gearup-api
  template:
    metadata:
      labels:
        app: gearup-api
        tags.datadoghq.com/service: gearup-api
        tags.datadoghq.com/env: development
        tags.datadoghq.com/version: local
      annotations:
        ad.datadoghq.com/gearup-api.checks: |
          {
            "http_check": {
              "instances": [
                {
                  "name": "gearup-api-ready",
                  "url": "http://%%host%%:8080/health/ready",
                  "timeout": 5,
                  "tags": [
                    "service:gearup-api",
                    "env:development"
                  ]
                }
              ]
            }
          }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gearup-api
          image: gearup-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: gearup-config
            - secretRef:
                name: gearup-secret
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observabilidade.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: Delta
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: "2Gi"
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: "2Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
